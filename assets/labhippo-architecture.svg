<rect x="56" y="1070" width="1808" height="166" rx="16" fill="#e9eff2" stroke="#cbd9df"/>
<text x="80" y="1111.0" font-size="22" font-weight="600" class="">GUARDRAILS ACROSS EVERY LAYER</text>
<text x="80" y="1150.0" font-size="26" font-weight="600" class="">Permission-aware retrieval</text>
<text x="80" y="1184" font-size="22" font-weight="400" class="secondary">Public · lab-only · restricted</text>
<text x="80" y="1213" font-size="22" font-weight="400" class="secondary">Filter records before search or AI use</text>
<text x="675" y="1150.0" font-size="26" font-weight="600" class="">Evidence &amp; review</text>
<text x="675" y="1184" font-size="22" font-weight="400" class="secondary">Sources, timestamps, review status</text>
<text x="675" y="1213" font-size="22" font-weight="400" class="secondary">Proposed changes → review → saved record</text>
<text x="1270" y="1150.0" font-size="26" font-weight="600" class="">Ownership &amp; readiness</text>
<text x="1270" y="1184" font-size="22" font-weight="400" class="secondary">Maintainers, backups, retention</text>
<text x="1270" y="1213" font-size="22" font-weight="400" class="secondary">Lifecycle ≠ restart readiness ≠ access</text>
<rect x="56" y="1258" width="1808" height="132" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="80" y="1297.0" font-size="22" font-weight="600" class="">STORAGE &amp; DEPLOYMENT / LOCAL, CLOUD OR HYBRID</text>
<text x="80" y="1336.0" font-size="24" font-weight="600" class="">Memory records</text>
<text x="80" y="1366.0" font-size="21" font-weight="400" class="secondary">Versioned Markdown + structured metadata</text>
<text x="675" y="1336.0" font-size="24" font-weight="600" class="">Research assets</text>
<text x="675" y="1366.0" font-size="21" font-weight="400" class="secondary">Existing local / NAS / cloud / repository storage</text>
<text x="1270" y="1336.0" font-size="24" font-weight="600" class="">Published views</text>
<text x="1270" y="1366.0" font-size="21" font-weight="400" class="secondary">Only the approved subset reaches the public site</text>
<text x="56" y="1438.0" font-size="21" font-weight="400" class="secondary">Conceptual design · Proposed integrations and interfaces · No operational deployment implied</text>
</svg>
