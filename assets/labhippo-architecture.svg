<text x="512" y="391.0" font-size="17" font-weight="400" class="secondary">link</text>
<rect x="560" y="914" width="800" height="124" rx="16" fill="#fff5ed" stroke="#ead4c3"/>
<text x="584" y="951.0" font-size="22" font-weight="600" class="">LINKS MAKE THE MEMORY USEFUL</text>
<text x="584" y="988.0" font-size="25" font-weight="400" class="">Data version → run + code version → figure → paper</text>
<text x="584" y="1019.0" font-size="21" font-weight="400" class="secondary">Decision records explain changes; issue records preserve caveats.</text>
<g data-card="Website / text">
<rect x="1424" y="270" width="440" height="140" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="1448" y="312.0" font-size="28" font-weight="600" class="">Website / text</text>
<text x="1448" y="352.0" font-size="22" font-weight="400" class="secondary">Project map + restart guide</text>
<text x="1448" y="383.24" font-size="22" font-weight="400" class="secondary">Approved public view → GitHub Pages</text>
</g>
<g data-card="Chat">
<rect x="1424" y="426" width="440" height="140" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="1448" y="468.0" font-size="28" font-weight="600" class="">Chat</text>
<text x="1448" y="508.0" font-size="22" font-weight="400" class="secondary">Questions → answers + sources</text>
<text x="1448" y="539.24" font-size="22" font-weight="400" class="secondary">Discord / LINE / web interface</text>
</g>
<g data-card="Flowcharts">
<rect x="1424" y="582" width="440" height="140" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="1448" y="624.0" font-size="28" font-weight="600" class="">Flowcharts</text>
<text x="1448" y="664.0" font-size="22" font-weight="400" class="secondary">Inspect dependencies</text>
<text x="1448" y="695.24" font-size="22" font-weight="400" class="secondary">Trace data → analysis → output</text>
</g>
<g data-card="Slides">
<rect x="1424" y="738" width="440" height="140" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="1448" y="780.0" font-size="28" font-weight="600" class="">Slides</text>
<text x="1448" y="820.0" font-size="22" font-weight="400" class="secondary">Project and handover briefings</text>
<text x="1448" y="851.24" font-size="22" font-weight="400" class="secondary">Generated from a dated snapshot</text>
</g>
<g data-card="Avatar">
<rect x="1424" y="894" width="440" height="140" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="1448" y="936.0" font-size="28" font-weight="600" class="">Avatar</text>
<text x="1448" y="976.0" font-size="22" font-weight="400" class="secondary">Optional spoken interaction</text>
