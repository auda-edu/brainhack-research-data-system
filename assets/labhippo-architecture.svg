<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1480" viewBox="0 0 1920 1480" role="img" aria-labelledby="title desc">
<title id="title">Labhippo architecture — proposed design</title><desc id="desc">Research records and existing tools connect to a shared project memory. Permission-filtered views include a website, chat, flowcharts, slides and an avatar. Ownership, access, review and flexible storage apply across all layers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#166b80"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafb"/>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#18313d}.secondary{fill:#48616e}.eyebrow{fill:#166b80;font-weight:600;letter-spacing:2px}.light{fill:#ffffff}</style>
<text x="56" y="65.0" font-size="21" font-weight="400" class="eyebrow">LABHIPPO / PROPOSED ARCHITECTURE</text>
<text x="56" y="133.0" font-size="52" font-weight="600" class="">Connect the records. Preserve the reasoning.</text>
<text x="56" y="180.0" font-size="28" font-weight="400" class="secondary">A research-memory layer for understanding, tracing and restarting a project.</text>
<text x="56" y="244.0" font-size="23" font-weight="400" class="eyebrow">01 / RECORD &amp; CONNECT</text>
<text x="560" y="244.0" font-size="23" font-weight="400" class="eyebrow">02 / SHARED RESEARCH MEMORY</text>
<text x="1424" y="244.0" font-size="23" font-weight="400" class="eyebrow">03 / UNDERSTAND &amp; USE</text>
<g data-card="Research records">
<rect x="56" y="270" width="440" height="316" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="80" y="312.0" font-size="28" font-weight="600" class="">Research records</text>
<text x="80" y="352.0" font-size="24" font-weight="400" class="secondary">Lab notebook · meeting notes</text>
<text x="80" y="386.08" font-size="24" font-weight="400" class="secondary">Calendar · schedule</text>
<text x="80" y="420.15999999999997" font-size="24" font-weight="400" class="secondary">SOPs · checklists</text>
<text x="80" y="454.24" font-size="24" font-weight="400" class="secondary">Videos · reviewed transcripts</text>
<text x="80" y="488.32" font-size="24" font-weight="400" class="secondary">Failure points · lessons learned</text>
<text x="80" y="522.4" font-size="24" font-weight="400" class="secondary">Papers · talks · posters · figures</text>
</g>
<g data-card="Authoring &amp; organization">
<rect x="56" y="608" width="440" height="168" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="80" y="650.0" font-size="28" font-weight="600" class="">Authoring &amp; organization</text>
<text x="80" y="690.0" font-size="23" font-weight="400" class="secondary">Markdown · spreadsheets · Obsidian</text>
<text x="80" y="722.66" font-size="23" font-weight="400" class="secondary">File naming · sidecar metadata</text>
</g>
<g data-card="Connected tools">
<rect x="56" y="798" width="440" height="240" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="80" y="840.0" font-size="28" font-weight="600" class="">Connected tools</text>
<text x="80" y="880.0" font-size="22" font-weight="400" class="secondary">Nipoppy → pipeline status</text>
<text x="80" y="911.24" font-size="22" font-weight="400" class="secondary">DataLad → data versions / provenance</text>
<text x="80" y="942.48" font-size="22" font-weight="400" class="secondary">Neurobagel → dataset / cohort search</text>
<text x="80" y="973.72" font-size="22" font-weight="400" class="secondary">Git / local code → code references</text>
</g>
<rect x="560" y="270" width="800" height="620" rx="16" fill="#eaf3f5" stroke="#cbd9df"/>
<text x="588" y="310.0" font-size="25" font-weight="600" class="">Common IDs + source links + version references</text>
<rect x="590" y="332" width="740" height="80" rx="12" fill="#166b80" stroke="#166b80"/>
<text x="612" y="366.0" font-size="22" font-weight="600" class="light">PROJECT REGISTRY</text>
<text x="612" y="396.0" font-size="23" font-weight="400" class="light">Research question · scope · lifecycle · responsible owner</text>
<g data-card="Activities &amp; runs">
<rect x="590" y="438" width="360" height="126" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="614" y="480.0" font-size="26" font-weight="600" class="">Activities &amp; runs</text>
<text x="614" y="520.0" font-size="19" font-weight="400" class="secondary">Plans, observations, actual runs</text>
<text x="614" y="546.98" font-size="19" font-weight="400" class="secondary">Inputs, parameters, environment</text>
</g>
<g data-card="Versioned assets">
<rect x="970" y="438" width="360" height="126" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="994" y="480.0" font-size="26" font-weight="600" class="">Versioned assets</text>
<text x="994" y="520.0" font-size="19" font-weight="400" class="secondary">Data, code and outputs</text>
<text x="994" y="546.98" font-size="19" font-weight="400" class="secondary">Source location + exact version</text>
</g>
<g data-card="Decisions">
<rect x="590" y="584" width="360" height="126" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="614" y="626.0" font-size="26" font-weight="600" class="">Decisions</text>
<text x="614" y="666.0" font-size="19" font-weight="400" class="secondary">Choice, alternatives, rationale</text>
<text x="614" y="692.98" font-size="19" font-weight="400" class="secondary">Evidence + reviewer</text>
</g>
<g data-card="Known issues">
<rect x="970" y="584" width="360" height="126" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="994" y="626.0" font-size="26" font-weight="600" class="">Known issues</text>
<text x="994" y="666.0" font-size="19" font-weight="400" class="secondary">Failed attempts + conditions</text>
<text x="994" y="692.98" font-size="19" font-weight="400" class="secondary">Resolution, limits, open questions</text>
</g>
<g data-card="People &amp; roles">
<rect x="590" y="730" width="360" height="126" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="614" y="772.0" font-size="26" font-weight="600" class="">People &amp; roles</text>
<text x="614" y="812.0" font-size="19" font-weight="400" class="secondary">Who did it? Who maintains it?</text>
<text x="614" y="838.98" font-size="19" font-weight="400" class="secondary">Who reviews or grants access?</text>
</g>
<g data-card="Handover state">
<rect x="970" y="730" width="360" height="126" rx="16" fill="#ffffff" stroke="#cbd9df"/>
<text x="994" y="772.0" font-size="26" font-weight="600" class="">Handover state</text>
<text x="994" y="812.0" font-size="19" font-weight="400" class="secondary">Next steps + prerequisites</text>
<text x="994" y="838.98" font-size="19" font-weight="400" class="secondary">Restart checks + blockers</text>
</g>
<path d="M960 412 V793 M950 501 H970 M950 647 H970 M950 793 H970" stroke="#166b80" stroke-width="2" fill="none"/>
<text x="588" y="878.0" font-size="18" font-weight="400" class="secondary">Each project links these record types through stable IDs.</text>
